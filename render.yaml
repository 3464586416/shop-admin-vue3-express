services:
  - type: web
    name: shop-admin
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install && npm --prefix server install && npm run build
    startCommand: node server/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: shop_db
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://${RENDER.externalHostname}
